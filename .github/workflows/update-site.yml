name: Update articles and deploy

on:
  schedule:
    # Mondays 06:00 JST
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Recompute the whole map layout (moves every point)"
        type: boolean
        default: false
      max_pages:
        description: "Listing pages to fetch (54 articles each)"
        type: number
        default: 3
  push:
    branches: [main]
    paths: ["site/**", "scripts/build.mjs"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Collect new articles
        run: >
          python collect_daily_news.py --all-pages --max-pages "${{ inputs.max_pages || 3 }}" --delay 1 --pretty
          --merge daily_news_articles.json --output daily_news_articles.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- daily_news_articles.json && [ "${{ inputs.full_rebuild }}" != "true" ]; then
            echo "No new articles"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache embedding model
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2

      - name: Install Python dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pip install -r requirements.lock.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build map data
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ "${{ inputs.full_rebuild }}" = "true" ]; then
            python scripts/build_map.py
          else
            python scripts/build_map.py --incremental
          fi

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Validate site data
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          added=$(git show HEAD:daily_news_articles.json | python -c "import json, sys; old = {a['url'] for a in json.load(sys.stdin)}; print(sum(a['url'] not in old for a in json.load(open('daily_news_articles.json'))))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_news_articles.json site/data/articles.json
          git diff --cached --quiet && exit 0
          git commit -m "Update articles (+${added})"
          git push

  deploy:
    needs: update
    # Deploy after an update, or directly on pushes to main (update is skipped then).
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
